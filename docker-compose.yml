version: '4'

services:
  server:
    build: ./
    image: chrisn0tdev/pos-app
    ports:
      - "5000:5000" 
    networks:
      - pos-network
    env_file: .env
    restart: unless-stopped
  proxy:
    build: ./proxy
    image: chrisn0tdev/pos-proxy
    ports:
      - "90:90" 
    depends_on:
      - mongo
    networks:
      - pos-network
    restart: unless-stopped

  sync:
    build: ./sync
    image: chrisn0tdev/pos-sync
    ports:
      - "91:91" 
    networks:
      - pos-network
    restart: always


  mongo:
    image: mongo
    restart: always
    ports:
      - "27017:27017" 
    volumes:
      - mongo-data:/data/db
    networks:
      - pos-network

networks:
  pos-network:
    driver: bridge
volumes:
  mongo-data:
    driver: local